workflow_id: pinduoduo-image-set
name: Pinduoduo Image Set (Legacy Compatibility Route)
version: 2.0.0
inherits: ecommerce-product-image-generation
compatibility_mode: compiler_default
platform_override: pinduoduo
goal: Compatibility pointer for historical Pinduoduo image-set runs. New runs compile the master contract plus the pinduoduo override; the marketplace-specific conversion, scene, design, and micro-detail controls are declarative contract fields.
route_defaults:
  image_count_range: [7, 9]
  require_role_specific_layout_variation: true
  minimum_true_scene_roles_for_8_image_set: 2
